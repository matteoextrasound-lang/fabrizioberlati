<figure class="anim">
<svg viewBox="0 30 420 260" data-still="6" role="img" aria-label="Animazione: vista di lato di una cassa sulla scrivania. Appoggiata dritta sul piano, il suono del tweeter arriva al petto e una parte rimbalza sul piano; inclinata verso l'alto su un supporto, il suono arriva alle orecchie.">

  <rect x="10" y="200" width="292" height="12" fill="#d9bb8c"/>
  <rect x="22" y="212" width="12" height="78" fill="#c9a774"/><rect x="276" y="212" width="12" height="78" fill="#c9a774"/>

  <rect x="330" y="196" width="80" height="9" rx="2" fill="#d9ccb5"/><rect x="392" y="120" width="10" height="80" rx="3" fill="#d9ccb5"/><rect x="364" y="205" width="10" height="85" fill="#d9ccb5"/>

  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 60 200;0 60 200;-7.8 60 200;-7.8 60 200;0 60 200;0 60 200" keyTimes="0;.42;.55;.92;.97;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.45 0 .25 1;0 0 1 1;.45 0 .25 1;0 0 1 1"/>

<figcaption><span>Appoggiata sul piano, la cassa manda gli acuti al petto e una parte del suono rimbalza sulla scrivania. Inclinata di pochi gradi, punta alle orecchie.</span><button type="button" class="anim-replay">Rivedi</button></figcaption>
</figure>
