<figure class="anim">
<svg viewBox="0 0 760 360" data-still="5.2" role="img" aria-label="Animazione: un amplificatore entra in un ripiano del mobile hi-fi. Poi compaiono le misure da controllare: lo spazio libero sopra, per l'aria calda, e lo spazio dietro, per spine e cavi.">
  <!-- mobile visto di lato: due ripiani e il montante posteriore -->
  <rect x="150" y="60" width="440" height="16" rx="3" fill="#c9a774"/>
  <rect x="150" y="250" width="440" height="16" rx="3" fill="#c9a774"/>
  <rect x="150" y="76" width="16" height="174" fill="#d9bb8c"/><rect x="574" y="76" width="16" height="174" fill="#d9bb8c"/>
  <rect x="150" y="266" width="16" height="60" fill="#d9bb8c"/><rect x="574" y="266" width="16" height="60" fill="#d9bb8c"/>
  <rect x="120" y="326" width="520" height="4" rx="2" fill="#d9ccb5"/>
  <!-- amplificatore che entra da davanti (da sinistra) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-330 0;-330 0;0 0;0 0" keyTimes="0;.06;.3;1" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 0 .2 1;0 0 1 1"/>
    <rect x="180" y="176" width="330" height="74" rx="5" fill="#3b2a1e"/>
    <rect x="180" y="176" width="330" height="10" rx="3" fill="#4d3a2b"/>
    <circle cx="205" cy="216" r="13" fill="#a87a2f"/><rect x="232" y="210" width="60" height="10" rx="3" fill="#6b4f2a"/>
    <!-- spine e cavi dietro -->
    <path d="M510 200 C 540 200, 545 230, 560 236" fill="none" stroke="#6f6254" stroke-width="5" stroke-linecap="round"/>
    <path d="M510 226 C 536 226, 540 246, 556 250" fill="none" stroke="#6f6254" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- quota: spazio sopra -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.36;.44;.93;1" dur="6s" repeatCount="indefinite"/>
    <g stroke="#a87a2f" stroke-width="3"><line x1="345" y1="80" x2="345" y2="172"/><line x1="333" y1="80" x2="357" y2="80"/><line x1="333" y1="172" x2="357" y2="172"/></g>
    <g stroke="#ff9a2e" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9">
      <path d="M230 166 q 8 -14 0 -28 q -8 -14 0 -28"><animate attributeName="stroke-dashoffset" values="0;-20" dur="1s" repeatCount="indefinite"/></path>
      <path d="M270 166 q 8 -14 0 -28 q -8 -14 0 -28"/>
    </g>
    <text x="365" y="132" font-size="24" font-weight="600" fill="#a87a2f">aria sopra</text>
  </g>
  <!-- quota: spazio dietro -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.55;.63;.93;1" dur="6s" repeatCount="indefinite"/>
    <g stroke="#a87a2f" stroke-width="3"><line x1="512" y1="292" x2="572" y2="292"/><line x1="512" y1="280" x2="512" y2="304"/><line x1="572" y1="280" x2="572" y2="304"/></g>
    <text x="604" y="300" font-size="24" font-weight="600" fill="#a87a2f">cavi</text>
  </g>
  <g font-size="22" fill="#6f6254"><text x="150" y="40">davanti</text><text x="590" y="40" text-anchor="end">dietro</text></g>
</svg>
<figcaption><span>Misura l'apparecchio, poi aggiungi lo spazio che gli serve: sopra per far uscire l'aria calda, dietro per spine e cavi.</span><button type="button" class="anim-replay">Rivedi</button></figcaption>
</figure>
